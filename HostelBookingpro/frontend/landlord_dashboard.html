<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Landlord Dashboard - UniStay</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dashboard-container { max-width: 1000px; margin: 50px auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2563eb; color: white; }
        
        /* Status Badges */
        .badge { padding: 5px 10px; border-radius: 15px; font-size: 0.85rem; font-weight: bold; }
        .pending { background: #fef3c7; color: #d97706; }
        .confirmed { background: #d1fae5; color: #059669; }
        .rejected { background: #fee2e2; color: #dc2626; }
        
        /* Action Buttons */
        .btn-action { padding: 5px 10px; cursor: pointer; border: none; border-radius: 5px; color: white; }
        .btn-approve { background: #10b981; }
        .btn-reject { background: #ef4444; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h2><i class="fas fa-tasks"></i> Manage Booking Requests</h2>
        
        <table id="bookingsTable">
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Phone</th>
                    <th>Hostel</th>
                    <th>Move-in Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadBookings);

        async function loadBookings() {
            const formData = new FormData();
            formData.append('action', 'fetch');

            const response = await fetch('../backend/manage_bookings.php', {
                method: 'POST',
                body: formData
            });
            const bookings = await response.json();
            
            const tbody = document.querySelector('#bookingsTable tbody');
            tbody.innerHTML = bookings.map(b => `
                <tr>
                    <td>${b.first_name} ${b.last_name}</td>
                    <td>${b.phone}</td>
                    <td>${b.hostel_name}</td>
                    <td>${b.move_in_date}</td>
                    <td><span class="badge ${b.status}">${b.status.toUpperCase()}</span></td>
                    <td>
                        ${b.status === 'pending' ? `
                            <button class="btn-action btn-approve" onclick="updateStatus(${b.id}, 'confirmed')"><i class="fas fa-check"></i></button>
                            <button class="btn-action btn-reject" onclick="updateStatus(${b.id}, 'rejected')"><i class="fas fa-times"></i></button>
                        ` : '-'}
                    </td>
                </tr>
            `).join('');
        }

        async function updateStatus(id, status) {
            if(!confirm(`Are you sure you want to ${status} this booking?`)) return;

            const formData = new FormData();
            formData.append('action', 'update');
            formData.append('id', id);
            formData.append('status', status);

            await fetch('../backend/manage_bookings.php', { method: 'POST', body: formData });
            
            // Reload table to see changes
            loadBookings();
        }
    </script>
</body>
</html>
