<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - UniStay</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <section class="auth-section">
        <div class="container auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-logo">
                        <div class="logo-icon"><i class="fas fa-home"></i></div>
                        <span class="logo-text">UniStay</span>
                    </div>
                    <h1 class="auth-title">Reset your password</h1>
                    <p class="auth-subtitle">Enter your email to receive a verification code</p>
                </div>

                <div id="messageBox" style="display:none; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;"></div>
                
                <form class="auth-form" id="forgotPasswordForm">
                    <div class="form-group">
                        <label for="resetEmail"><i class="fas fa-envelope"></i> Email address*</label>
                        <input type="email" id="resetEmail" name="email" class="form-control" placeholder="example@gmail.com" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 2rem;">
                        <i class="fas fa-paper-plane"></i> Send Code
                    </button>
                    
                    <div class="auth-footer" style="margin-top: 2rem;">
                        <a href="login.html" class="btn btn-outline" style="width: 100%;">
                            <i class="fas fa-arrow-left"></i> Back to Sign In
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <div id="otpModal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
        <div class="modal-content" style="background: white; margin: 15% auto; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; position: relative;">
            <span class="close" style="position: absolute; right: 15px; top: 10px; cursor: pointer; font-size: 20px;">&times;</span>
            <h3 style="text-align: center;">Enter Code</h3>
            <p style="text-align: center; font-size: 0.9rem; color: #666;">Check your email for the 5-digit code.</p>
            
            <form id="otpForm">
                <input type="hidden" id="hiddenEmail" name="email">
                <div class="form-group">
                    <input type="text" id="otpCode" name="otp_code" class="form-control" placeholder="12345" maxlength="5" style="text-align: center; letter-spacing: 5px; font-size: 1.5rem;" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Verify & Reset</button>
            </form>
        </div>
    </div>
    
    <script src="forgot_password.js"></script>
</body>
</html>
