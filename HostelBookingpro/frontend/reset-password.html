<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - UniStay</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <section class="auth-section">
        <div class="container auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-logo">
                        <div class="logo-icon"><i class="fas fa-home"></i></div>
                        <span class="logo-text">UniStay</span>
                    </div>
                    <h1 class="auth-title">Set New Password</h1>
                    <p class="auth-subtitle">Create a strong password for your account</p>
                </div>
                
                <div id="msgBox" style="display:none; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;"></div>

                <form class="auth-form" id="resetForm">
                    <input type="hidden" id="email" name="email">
                    <input type="hidden" id="otp_code" name="otp_code">

                    <div class="form-group">
                        <label for="newPassword"><i class="fas fa-lock"></i> New Password</label>
                        <input type="password" id="newPassword" name="new_password" class="form-control" placeholder="At least 8 characters" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1.5rem;">
                        <i class="fas fa-check-circle"></i> Update Password
                    </button>
                </form>
            </div>
        </div>
    </section>

    <script src="reset_password.js"></script>
    
    </body>
</html>
